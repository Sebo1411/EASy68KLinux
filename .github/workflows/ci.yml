name: CI Build & Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [Release, Debug]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            qt6-base-dev \
            libqt6widgets6 \
            libqt6gui6 \
            libqt6test6 \
            xvfb \
            ${{ matrix.compiler == 'clang++' && 'clang' || '' }}

      - name: Configure CMake
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build All Targets
        run: cmake --build build --parallel

      - name: Run Native & GUI Test Suite
        run: |
          xvfb-run --auto-servernum ctest --test-dir build --output-on-failure --parallel 4

  sanitizers:
    name: Address & UB Sanitizers (ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            qt6-base-dev \
            libqt6widgets6 \
            libqt6gui6 \
            libqt6test6 \
            xvfb \
            libasan8 \
            libubsan1

      - name: Configure CMake with Sanitizers
        run: |
          cmake -B build-san -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build with Sanitizers
        run: cmake --build build-san --parallel

      - name: Run Test Suite under Sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:abort_on_error=1
        run: |
          xvfb-run --auto-servernum ctest --test-dir build-san --output-on-failure

  package:
    name: Package (DEB, RPM, TGZ & AppImage)
    runs-on: ubuntu-24.04
    needs: [build-and-test, sanitizers]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            qt6-base-dev \
            libqt6widgets6 \
            libqt6gui6 \
            libqt6test6 \
            rpm \
            file \
            wget \
            xvfb

      - name: Configure Release Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build Release
        run: cmake --build build --parallel

      - name: Verify Tests in Release Build
        run: |
          xvfb-run --auto-servernum ctest --test-dir build --output-on-failure

      - name: Generate DEB, RPM, and TGZ Packages
        run: |
          cd build
          cpack -G "TGZ;DEB;RPM"
          mkdir -p ../dist
          cp *.tar.gz *.deb *.rpm ../dist/

      - name: Build Standalone AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/plugins/platforms AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps AppDir/usr/share/easy68k AppDir/usr/share/doc/easy68k

          # Copy binaries
          cp build/easy68k-gui AppDir/usr/bin/
          cp build/easy68k-asm AppDir/usr/bin/
          cp build/easy68k-sim AppDir/usr/bin/
          cp build/easybin AppDir/usr/bin/

          # Bundle Qt6 libraries and platform plugins
          ldd build/easy68k-gui | awk '/=> \/.*libQt6|libicu|libdouble-conversion|libb2|libpcre2-16/ {print $3}' | xargs -r -I{} cp -L "{}" AppDir/usr/lib/
          for plugin_dir in /usr/lib/x86_64-linux-gnu/qt6/plugins/platforms /usr/lib64/qt6/plugins/platforms; do
            if [ -d "$plugin_dir" ]; then
              cp -r "$plugin_dir"/* AppDir/usr/plugins/platforms/ || true
            fi
          done

          # Copy desktop integration files
          cp desktop/easy68k.desktop AppDir/
          cp desktop/easy68k.desktop AppDir/usr/share/applications/
          cp desktop/easy68k.svg AppDir/
          ln -sf easy68k.svg AppDir/.DirIcon
          cp desktop/easy68k.svg AppDir/usr/share/icons/hicolor/scalable/apps/

          # Copy documentation and examples
          cp -r docs/help AppDir/usr/share/doc/easy68k/
          cp -r examples AppDir/usr/share/easy68k/

          # Create AppRun entrypoint script
          cat << 'EOF' > AppDir/AppRun
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH:-}"
          export QT_PLUGIN_PATH="${HERE}/usr/plugins:${QT_PLUGIN_PATH:-}"
          exec "${HERE}/usr/bin/easy68k-gui" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Download and run appimagetool
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/easy68k-linux-5.16.1-x86_64.AppImage
          chmod +x dist/easy68k-linux-5.16.1-x86_64.AppImage

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Packaging Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easy68k-linux-packages
          path: dist/*
          if-no-files-found: error
