name: CI Build & Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [Release, Debug]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-multimedia-dev \
            libqt6widgets6 \
            libqt6gui6 \
            libqt6network6 \
            libqt6test6 \
            libqt6multimedia6 \
            ${{ matrix.compiler == 'clang++' && 'clang' || '' }}

      - name: Configure CMake
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build All Targets
        run: cmake --build build --parallel

      - name: Run Native & GUI Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure --parallel 4

  sanitizers:
    name: Address & UB Sanitizers (ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-multimedia-dev \
            libqt6widgets6 \
            libqt6gui6 \
            libqt6network6 \
            libqt6test6 \
            libqt6multimedia6 \
            libasan8 \
            libubsan1

      - name: Configure CMake with Sanitizers
        run: |
          cmake -B build-san -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build with Sanitizers
        run: cmake --build build-san --parallel

      - name: Run Test Suite under Sanitizers
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:abort_on_error=1
        run: |
          ctest --test-dir build-san --output-on-failure

  package:
    name: Package (DEB, RPM, TGZ, AppImage zsync & Repo)
    runs-on: ubuntu-24.04
    needs: [build-and-test, sanitizers]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-multimedia-dev \
            libqt6widgets6 \
            libqt6gui6 \
            libqt6network6 \
            libqt6test6 \
            libqt6multimedia6 \
            rpm \
            dpkg-dev \
            apt-utils \
            createrepo-c \
            zsync \
            librsvg2-bin \
            file \
            wget

      - name: Configure Release Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build Release
        run: cmake --build build --parallel

      - name: Verify Tests in Release Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure

      - name: Generate DEB, RPM, and TGZ Packages
        run: |
          cd build
          cpack -G "TGZ;DEB;RPM"
          mkdir -p ../dist
          cp *.tar.gz *.deb *.rpm ../dist/

      - name: Build Standalone AppImage with zsync Delta Metadata
        run: |
          VERSION=$(sed -n 's/^project(EASy68KLinux VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          chmod +x scripts/build_appimage.sh
          ./scripts/build_appimage.sh build dist "${VERSION:-5.16.1}" Sebo1411 EASy68KLinux

      - name: Verify Automated APT & RPM Repository Generation
        run: |
          chmod +x scripts/generate_repos.sh
          ./scripts/generate_repos.sh dist gh-pages-root "https://sebo1411.github.io/EASy68KLinux" "Sebo1411/EASy68KLinux"
          test -s gh-pages-root/apt/Packages.gz
          test -s gh-pages-root/apt/Release
          test -s gh-pages-root/rpm/repodata/repomd.xml
          test -x gh-pages-root/setup-apt.sh
          test -x gh-pages-root/setup-rpm.sh
          grep -Fq "https://sebo1411.github.io/EASy68KLinux/rpm" gh-pages-root/setup-rpm.sh
          ! grep -Fq '${REPO_URL}' gh-pages-root/setup-rpm.sh

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Packaging Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: easy68k-linux-packages
          path: dist/*
          if-no-files-found: error
