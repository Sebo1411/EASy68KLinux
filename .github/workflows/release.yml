name: Release Packaging & Publishing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v5.16.1)'
        required: false
        default: 'v5.16.1'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            qt6-base-dev \
            libqt6widgets6 \
            libqt6gui6 \
            libqt6test6 \
            rpm \
            file \
            wget \
            xvfb

      - name: Configure Release Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build All Binaries
        run: cmake --build build --parallel

      - name: Run Test Suite Verification
        run: |
          xvfb-run --auto-servernum ctest --test-dir build --output-on-failure

      - name: Generate CPack Packages (DEB, RPM, TGZ)
        run: |
          cd build
          cpack -G "TGZ;DEB;RPM"
          mkdir -p ../dist
          cp *.tar.gz *.deb *.rpm ../dist/

      - name: Build Standalone AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/plugins/platforms AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps AppDir/usr/share/easy68k AppDir/usr/share/doc/easy68k

          # Copy binaries
          cp build/easy68k-gui AppDir/usr/bin/
          cp build/easy68k-asm AppDir/usr/bin/
          cp build/easy68k-sim AppDir/usr/bin/
          cp build/easybin AppDir/usr/bin/

          # Bundle Qt6 libraries and platform plugins
          ldd build/easy68k-gui | awk '/=> \/.*libQt6|libicu|libdouble-conversion|libb2|libpcre2-16/ {print $3}' | xargs -r -I{} cp -L "{}" AppDir/usr/lib/
          for plugin_dir in /usr/lib/x86_64-linux-gnu/qt6/plugins/platforms /usr/lib64/qt6/plugins/platforms; do
            if [ -d "$plugin_dir" ]; then
              cp -r "$plugin_dir"/* AppDir/usr/plugins/platforms/ || true
            fi
          done

          # Copy desktop integration files
          cp desktop/easy68k.desktop AppDir/
          cp desktop/easy68k.desktop AppDir/usr/share/applications/
          cp desktop/easy68k.svg AppDir/
          ln -sf easy68k.svg AppDir/.DirIcon
          cp desktop/easy68k.svg AppDir/usr/share/icons/hicolor/scalable/apps/

          # Copy documentation and examples
          cp -r docs/help AppDir/usr/share/doc/easy68k/
          cp -r examples AppDir/usr/share/easy68k/

          # Create AppRun entrypoint script
          cat << 'EOF' > AppDir/AppRun
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH:-}"
          export QT_PLUGIN_PATH="${HERE}/usr/plugins:${QT_PLUGIN_PATH:-}"
          exec "${HERE}/usr/bin/easy68k-gui" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Download and run appimagetool
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/easy68k-linux-5.16.1-x86_64.AppImage
          chmod +x dist/easy68k-linux-5.16.1-x86_64.AppImage

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: EASy68K Linux Native ${{ github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
