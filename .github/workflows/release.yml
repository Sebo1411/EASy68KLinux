name: Release Packaging & Publishing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v5.17.0)'
        required: false
        default: 'v5.17.0'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    name: Build & Publish Release Packages + Auto-Update Repo
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-multimedia-dev \
            libqt6widgets6 \
            libqt6gui6 \
            libqt6network6 \
            libqt6test6 \
            libqt6multimedia6 \
            rpm \
            dpkg-dev \
            apt-utils \
            createrepo-c \
            zsync \
            librsvg2-bin \
            file \
            wget

      - name: Configure Release Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build All Binaries
        run: cmake --build build --parallel

      - name: Run Test Suite Verification
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure

      - name: Generate CPack Packages (DEB, RPM, TGZ)
        run: |
          cd build
          cpack -G "TGZ;DEB;RPM"
          mkdir -p ../dist
          cp *.tar.gz *.deb *.rpm ../dist/

      - name: Build Standalone AppImage with zsync Delta Metadata
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "master" ] || [ "${VERSION}" = "main" ]; then
            VERSION=$(sed -n 's/^project(EASy68KLinux VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          fi
          chmod +x scripts/build_appimage.sh
          ./scripts/build_appimage.sh build dist "${VERSION:-5.17.0}" Sebo1411 EASy68KLinux

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: EASy68K Linux Native ${{ inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*

      - name: Build & Publish Automated APT & RPM Repo to gh-pages
        run: |
          chmod +x scripts/generate_repos.sh
          ./scripts/generate_repos.sh dist gh-pages-root "https://sebo1411.github.io/EASy68KLinux" "Sebo1411/EASy68KLinux"

          pushd gh-pages-root
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(repo): update APT and RPM repositories for ${{ inputs.tag_name || github.ref_name }}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
          popd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
