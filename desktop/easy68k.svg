<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e39"/>
      <stop offset="50%" stop-color="#1b1e26"/>
      <stop offset="100%" stop-color="#12141a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0091ea"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Plate -->
  <rect x="6" y="6" width="116" height="116" rx="24" fill="url(#bgGrad)" stroke="#37474f" stroke-width="2"/>

  <!-- PCB Circuit Traces -->
  <path d="M 24 20 L 24 38 L 38 52 M 104 20 L 104 38 L 90 52 M 24 108 L 24 90 L 38 76 M 104 108 L 104 90 L 90 76" 
        stroke="#ffb300" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  <circle cx="24" cy="20" r="2.5" fill="#ffd54f" opacity="0.6"/>
  <circle cx="104" cy="20" r="2.5" fill="#ffd54f" opacity="0.6"/>
  <circle cx="24" cy="108" r="2.5" fill="#ffd54f" opacity="0.6"/>
  <circle cx="104" cy="108" r="2.5" fill="#ffd54f" opacity="0.6"/>

  <!-- Dual Inline Pins -->
  <g fill="url(#goldGrad)">
    <!-- Top Pins -->
    <rect x="36" y="24" width="4" height="8" rx="1"/>
    <rect x="46" y="24" width="4" height="8" rx="1"/>
    <rect x="56" y="24" width="4" height="8" rx="1"/>
    <rect x="68" y="24" width="4" height="8" rx="1"/>
    <rect x="78" y="24" width="4" height="8" rx="1"/>
    <rect x="88" y="24" width="4" height="8" rx="1"/>
    <!-- Bottom Pins -->
    <rect x="36" y="96" width="4" height="8" rx="1"/>
    <rect x="46" y="96" width="4" height="8" rx="1"/>
    <rect x="56" y="96" width="4" height="8" rx="1"/>
    <rect x="68" y="96" width="4" height="8" rx="1"/>
    <rect x="78" y="96" width="4" height="8" rx="1"/>
    <rect x="88" y="96" width="4" height="8" rx="1"/>
  </g>

  <!-- Central 68000 DIP / QFP Chip Body -->
  <rect x="30" y="30" width="68" height="68" rx="8" fill="url(#chipGrad)" stroke="#455a64" stroke-width="2"/>
  <circle cx="38" cy="38" r="3" fill="#263238" stroke="#37474f" stroke-width="1"/>

  <!-- Chip Branding -->
  <text x="64" y="58" font-family="DejaVu Sans, Arial, sans-serif" font-weight="900" font-size="12" fill="#eceff1" text-anchor="middle" letter-spacing="1">
    EASy68K
  </text>
  <text x="64" y="74" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="10" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">
    MC68000
  </text>
  <text x="64" y="86" font-family="DejaVu Sans Mono, monospace" font-size="6" fill="#90a4ae" text-anchor="middle">
    NATIVE LINUX
  </text>

  <!-- Status LEDs -->
  <circle cx="20" cy="64" r="3.5" fill="#00e676" filter="url(#glow)"/>
  <circle cx="108" cy="64" r="3.5" fill="url(#blueGlow)" filter="url(#glow)"/>
</svg>
